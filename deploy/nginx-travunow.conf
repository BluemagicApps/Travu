# Nginx reverse proxy for Travu → Next.js on 127.0.0.1:3000
# Install:
#   sudo cp deploy/nginx-travunow.conf /etc/nginx/sites-available/travunow
#   sudo ln -s /etc/nginx/sites-available/travunow /etc/nginx/sites-enabled/travunow
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with:  sudo certbot --nginx -d travunow.com -d www.travunow.com
# (certbot rewrites this file to add the :443 block + redirect automatically.)

server {
    listen 80;
    listen [::]:80;
    server_name travunow.com www.travunow.com;

    # Let Next.js handle gzip/caching; just proxy everything through.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
}
